# Minimal SearXNG config for Almanac. The important bit is enabling the JSON
# output format, which web_search() consumes. Change the secret_key.
use_default_settings: true

server:
  secret_key: "change-me-searxng-secret"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json
